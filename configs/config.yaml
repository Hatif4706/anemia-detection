experiment:
  name: "anemia_palpebral_conjunctiva_benchmark"
  seed: 42
  device: "cuda" # 'cuda' atau 'cpu' (otomatis jatuh ke cpu bila CUDA tidak ada)

dataset:
  # 'eyes_defy_anemia' = data penelitian (Dimauro et al., 2023)
  # 'synthetic'        = data buatan HANYA untuk uji fungsi kode, bukan hasil penelitian
  source: "eyes_defy_anemia"
  eyes_defy_anemia_dir: "data/raw/eyes_defy_anemia" # berisi folder Italy/ dan India/
  mask_name: "palpebral.png" # mask konjungtiva palpebral buatan ahli
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

labeling:
  # Batas Hb (g/dL) menurut WHO / Kemenkes RI (2018). Anemia jika Hb < batas.
  female: 12.0
  male: 13.0
  child_under_5: 11.0
  unknown: 12.0 # dipakai bila jenis kelamin tidak tercatat

preprocessing:
  clahe_for_segmentation: true # CLAHE hanya untuk masukan YOLO/U-Net
  clahe_for_classifier: false # warna asli dipertahankan agar sinyal kepucatan tidak berubah

yolo_detector:
  model_type: "yolov8n.pt" # bobot pretrained COCO, di-fine-tune 1 kelas
  class_name: "konjungtiva_palpebral"
  epochs: 80
  batch_size: 16
  imgsz: 640
  confidence_threshold: 0.25
  iou_threshold: 0.5
  crop_padding: 0.10
  weights_out: "models/yolo_conjunctiva.pt"

unet_segmenter:
  encoder_name: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1
  input_size: 256
  epochs: 60
  batch_size: 8
  learning_rate: 0.0003
  loss_fn: "dice_bce"
  mask_threshold: 0.5
  train_crop_padding: [0.05, 0.25] # jitter padding crop agar tahan terhadap kotak YOLO yang meleset
  weights_out: "models/unet_resnet34.pt"

mediapipe:
  model_asset_path: "models/face_landmarker.task"
  num_faces: 1
  expansion_factor: 1.15

classifier:
  architecture: "mobilenet_v3_small"
  pretrained: true # bobot ImageNet
  input_size: 224
  epochs: 40
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 8
  decision_threshold: 0.5
  # 'per_pipeline': classifier dilatih ulang pada ROI dari masing-masing pipeline (setelan identik)
  training_mode: "per_pipeline"

evaluation:
  reports_dir: "reports"
  bootstrap_iterations: 1000
  alpha: 0.05
