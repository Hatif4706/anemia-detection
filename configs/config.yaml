experiment:
  name: "anemia_palpebral_conjunctiva_benchmark"
  seed: 42
  device: "cuda" # 'cuda' or 'cpu'

dataset:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  image_size: [640, 640]
  roi_crop_size: [256, 256]

yolo_detector:
  model_type: "yolov8n.pt" # or yolov11n.pt
  epochs: 50
  batch_size: 16
  imgsz: 640
  confidence_threshold: 0.45
  iou_threshold: 0.5

unet_segmenter:
  encoder_name: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1 # binary mask (conjunctiva vs background)
  epochs: 60
  batch_size: 8
  learning_rate: 0.0003
  loss_fn: "dice_bce" # Combination of Dice Loss & BCE
  mask_threshold: 0.5

mediapipe:
  max_num_faces: 1
  refine_landmarks: true
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  # Eyelid landmarks for lower palpebral conjunctiva
  # Left Eye Lower Palpebral indices: [33, 7, 163, 144, 145, 153, 154, 155, 133]
  # Right Eye Lower Palpebral indices: [263, 249, 390, 373, 374, 380, 381, 382, 362]
  expansion_factor: 1.15 # Expansion ratio to capture lower everted conjunctival sac

features:
  color_spaces:
    - "rgb"
    - "hsv"
    - "lab"
  colorimetric_indices:
    - "erythema_index" # log(R) - log(G)
    - "red_ratio"      # R / (R + G + B)
    - "pallor_index"   # (R - G) / (R + G)
    - "lab_a_mean"     # Mean of a* channel (redness degree)
    - "lab_b_mean"     # Mean of b* channel (yellowness degree)
  texture:
    use_glcm: true
    distances: [1, 3]
    angles: [0, 0.785, 1.571, 2.356]

classifiers:
  models:
    - "xgboost"
    - "svm_rbf"
    - "random_forest"
  cv_folds: 5
  scoring: "roc_auc"

evaluation:
  save_dir: "reports"
  metrics_segmentation:
    - "iou"
    - "dice_score"
    - "precision"
    - "recall"
    - "latency_ms"
    - "fps"
  metrics_classification:
    - "accuracy"
    - "sensitivity_recall" # Critical for medical screening
    - "specificity"
    - "precision"
    - "f1_score"
    - "roc_auc"
